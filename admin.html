<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<style>
  :root { --c:#1f4fa3; --bg:#eef2f8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; background:var(--bg); color:#1d2433; }
  header { background:var(--c); color:#fff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:1.15rem; margin:0; } header a { color:#cfe0ff; font-size:.85rem; text-decoration:none; }
  .wrap { max-width:1000px; margin:0 auto; padding:14px; }
  .box { background:#fff; border-radius:16px; padding:16px; box-shadow:0 4px 16px rgba(20,40,80,.08); margin-bottom:14px; }
  input, select, textarea { width:100%; padding:11px 12px; font-size:1rem; border:1px solid #c9d2e3; border-radius:10px; font-family:inherit; }
  textarea { min-height:70px; }
  button, .btn { padding:11px 16px; font-size:1rem; font-weight:700; color:#fff; background:var(--c); border:0; border-radius:10px; cursor:pointer; display:inline-block; }
  button.alt { background:#fff; color:var(--c); border:2px solid var(--c); }
  button.danger { background:#c0392b; }
  button:disabled { opacity:.5; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .bar input { flex:1; min-width:180px; }
  .msg { font-size:.9rem; color:#5a6475; margin:8px 0; min-height:1.2em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .item { background:#fff; border-radius:12px; padding:10px; text-align:center; cursor:pointer; box-shadow:0 2px 8px rgba(20,40,80,.06); }
  .item img { width:84px; height:84px; border-radius:50%; object-fit:cover; background:#dde3ee; }
  .item b { display:block; margin-top:6px; } .item small { color:#5a6475; display:block; font-size:.78rem; }
  .warn { color:#c0392b; font-size:.75rem; }
  .form { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .form label { font-size:.85rem; color:#5a6475; display:block; }
  .form .wide { grid-column:1/-1; }
  .pics { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .pics img { max-height:180px; max-width:100%; border-radius:10px; background:#dde3ee; }
  .pics .f { width:110px; height:110px; border-radius:50%; object-fit:cover; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-start; justify-content:center; overflow:auto; padding:20px 10px; }
  #modal .box { width:100%; max-width:760px; }
  input[type=file] { display:none; }
  @media (max-width:600px) { .form { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header><h1>EMBA 人脈後台</h1><a href="index.html">← 回拍照認人</a></header>
<div class="wrap">
  <div class="box" id="login">
    <div class="bar"><input type="password" id="pw" placeholder="請輸入後台密碼"><button onclick="login()">登入</button></div>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="main" style="display:none">
    <div class="box">
      <div class="bar">
        <input id="q" placeholder="搜尋姓名、公司…">
        <select id="fc" style="width:auto"><option value="">全部屆別</option><option>114</option><option>115</option></select>
        <button onclick="edit(null)">＋ 新增</button>
        <button class="alt" onclick="rebuild()">重算缺少的臉部特徵</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>
    <div class="grid" id="list"></div>
  </div>
</div>

<div id="modal"><div class="box">
  <h2 id="mt" style="margin-top:0">編輯</h2>
  <div class="pics">
    <img id="pPhoto" alt=""><img id="pFace" class="f" alt="">
    <div>
      <label class="btn" for="up">📷 上傳／拍攝照片</label>
      <input type="file" id="up" accept="image/*">
      <div class="msg" id="faceMsg">可上傳自介卡或大頭照，系統會自動找出臉</div>
    </div>
  </div>
  <div class="form" style="margin-top:12px">
    <div><label>屆別</label><select id="f_cohort"><option>115</option><option>114</option><option>113</option><option>116</option></select></div>
    <div><label>系所</label><input id="f_dept" placeholder="管研甲 / 管研乙"></div>
    <div><label>中文姓名</label><input id="f_name_zh"></div>
    <div><label>英文名</label><input id="f_name_en"></div>
    <div><label>服務單位</label><input id="f_company"></div>
    <div><label>職稱</label><input id="f_title"></div>
    <div><label>星座</label><input id="f_zodiac"></div>
    <div><label>興趣</label><input id="f_hobbies"></div>
    <div class="wide"><label>一句話</label><textarea id="f_quote"></textarea></div>
    <div class="wide"><label>其他（電話、Email、備註）</label><textarea id="f_other"></textarea></div>
  </div>
  <div class="bar" style="margin-top:14px; justify-content:space-between">
    <button class="danger" id="del" onclick="del()">刪除</button>
    <div class="bar"><button class="alt" onclick="closeM()">取消</button><button id="save" onclick="save()">儲存</button></div>
  </div>
  <div class="msg" id="saveMsg"></div>
</div></div>

<script>
const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/';
const FIELDS = ['cohort','dept','name_zh','name_en','company','title','zodiac','hobbies','quote','other'];
const $ = id => document.getElementById(id);
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PW = sessionStorage.getItem('emba_pw') || '', people = [], cur = null, pending = null, modelsP = null;
const cache = {};
const photo = (id, w) => cache[id + w] ? Promise.resolve(cache[id + w]) : apiGet({ action: 'photo', id, w: w || 0, key: PW }).then(d => (cache[id + w] = d));

function models() {
  if (!modelsP) modelsP = Promise.all([
    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)]);
  return modelsP;
}

function login() {
  PW = $('pw').value || PW;
  apiPost({ action: 'login', pw: PW }).then(() => {
    sessionStorage.setItem('emba_pw', PW);
    $('login').style.display = 'none'; $('main').style.display = '';
    load(); models();
  }).catch(e => { sessionStorage.removeItem('emba_pw'); $('loginMsg').textContent = e.message; });
}
if (PW) login();
$('pw').onkeydown = e => { if (e.key === 'Enter') login(); };

function load() {
  $('msg').textContent = '載入中…';
  apiGet({ action: 'people', key: PW }).then(l => { people = l; render(); });
}
function render() {
  const k = $('q').value.trim().toLowerCase(), c = $('fc').value;
  const list = people.filter(p => (!c || p.cohort === c) &&
    (!k || [p.name_zh, p.name_en, p.company, p.title, p.dept].join(' ').toLowerCase().includes(k)));
  const noFace = people.filter(p => !Array.isArray(p.descriptor)).length;
  $('msg').textContent = `共 ${people.length} 人，顯示 ${list.length} 人` + (noFace ? `，${noFace} 人缺臉部特徵` : '');
  $('list').innerHTML = '';
  list.forEach(p => {
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = `<img alt=""><b>${esc(p.name_zh)}</b><small>${esc(p.cohort)} ${esc(p.dept)}</small><small>${esc(p.company)}</small>` +
      (Array.isArray(p.descriptor) ? '' : '<div class="warn">缺臉部特徵</div>');
    d.onclick = () => edit(p);
    $('list').appendChild(d);
    const id = p.faceId || p.photoId;
    if (id) photo(id, p.faceId ? 0 : 300).then(s => d.querySelector('img').src = s).catch(() => {});
  });
}
$('q').oninput = render; $('fc').onchange = render;

function edit(p) {
  cur = p; pending = null;
  $('mt').textContent = p ? '編輯：' + p.name_zh : '新增人脈';
  FIELDS.forEach(f => $('f_' + f).value = p ? (p[f] || '') : (f === 'cohort' ? '115' : ''));
  $('pPhoto').src = ''; $('pFace').src = ''; $('saveMsg').textContent = '';
  $('faceMsg').textContent = '可上傳自介卡或大頭照，系統會自動找出臉';
  $('del').style.display = p ? '' : 'none';
  if (p && p.photoId) photo(p.photoId, 800).then(s => $('pPhoto').src = s);
  if (p && p.faceId) photo(p.faceId, 0).then(s => $('pFace').src = s);
  $('modal').style.display = 'flex';
}
function closeM() { $('modal').style.display = 'none'; }

function toCanvas(src, max) {
  return new Promise(ok => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c);
    };
    img.src = src;
  });
}

// 找最大的臉，回傳臉部裁切圖與特徵
async function analyze(canvas) {
  await models();
  const dets = await faceapi.detectAllFaces(canvas, new faceapi.SsdMobilenetv1Options({ minConfidence: .4 }))
    .withFaceLandmarks().withFaceDescriptors();
  if (!dets.length) return null;
  dets.sort((a, b) => b.detection.box.area - a.detection.box.area);
  const b = dets[0].detection.box, m = .45;
  const size = Math.max(b.width, b.height) * (1 + 2 * m);
  const x = Math.max(0, b.x - b.width * m), y = Math.max(0, b.y - b.height * m * 1.1);
  const fc = document.createElement('canvas'); fc.width = fc.height = 300;
  fc.getContext('2d').fillStyle = '#fff'; fc.getContext('2d').fillRect(0, 0, 300, 300);
  fc.getContext('2d').drawImage(canvas, x, y, size, size, 0, 0, 300, 300);
  return { face: fc.toDataURL('image/jpeg', .85), descriptor: Array.from(dets[0].descriptor).map(v => +v.toFixed(5)) };
}

$('up').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  $('faceMsg').textContent = '分析臉部中…';
  const src = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(f); });
  const c = await toCanvas(src, 1400);
  const img = c.toDataURL('image/jpeg', .85);
  $('pPhoto').src = img;
  const a = await analyze(c);
  if (!a) { $('faceMsg').textContent = '⚠ 找不到臉，仍可儲存，但無法拍照比對'; pending = { img }; return; }
  $('pFace').src = a.face;
  $('faceMsg').textContent = '✓ 已找到臉部特徵';
  pending = { img, face: a.face, descriptor: a.descriptor };
};

function save() {
  const o = { id: cur ? cur.id : '' };
  FIELDS.forEach(f => o[f] = $('f_' + f).value.trim());
  if (!o.name_zh) { $('saveMsg').textContent = '請填中文姓名'; return; }
  if (pending && pending.descriptor) o.descriptor = pending.descriptor;
  $('save').disabled = true; $('saveMsg').textContent = '儲存中…';
  apiPost({ action: 'save', pw: PW, person: o, image: pending ? pending.img : null, face: pending ? pending.face || null : null })
    .then(() => { $('save').disabled = false; closeM(); load(); })
    .catch(e => { $('save').disabled = false; $('saveMsg').textContent = '失敗：' + e.message; });
}
function del() {
  if (!cur || !confirm('確定刪除 ' + cur.name_zh + '？')) return;
  apiPost({ action: 'delete', pw: PW, id: cur.id }).then(() => { closeM(); load(); });
}

async function rebuild() {
  const todo = people.filter(p => !Array.isArray(p.descriptor) && p.photoId && p.descriptor !== 'NOFACE');
  if (!todo.length) { $('msg').textContent = '全部都有臉部特徵了'; return; }
  for (let i = 0; i < todo.length; i++) {
    const p = todo[i];
    $('msg').textContent = `重算中 ${i + 1}/${todo.length}：${p.name_zh}`;
    try {
      const c = await toCanvas(await photo(p.photoId, 1400), 1400);
      const a = await analyze(c);
      if (a) await apiPost({ action: 'save', pw: PW, person: { id: p.id, descriptor: a.descriptor }, face: a.face });
      else await apiPost({ action: 'descriptor', pw: PW, id: p.id, descriptor: null });
    } catch (e) { console.log(e); }
  }
  load();
}
</script>
</body>
</html>
